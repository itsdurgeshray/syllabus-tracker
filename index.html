<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Syllabus Tracker — SSC CGL</title>
<meta name="description" content="A fast, minimal study tracker for SSC CGL Tier 1, Tier 2 Paper 1 and Tier 2 Paper 3 with completion analytics." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23111%22/><path d=%22M4 8.5l2.5 2.5L12 5%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- Sidebar / mobile top nav -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">ST</span>
      <span class="brand-name">Syllabus<br/>Tracker</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 11h4v6H3v-6ZM8 5h4v12H8V5ZM13 8h4v9h-4V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="tier1">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v12H4V4Z" stroke="currentColor" stroke-width="1.4"/><path d="M7 8h6M7 11h6M7 14h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Tier 1</span>
      </button>
      <button class="nav-item" data-view="tier2p1">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v12H4V4Z" stroke="currentColor" stroke-width="1.4"/><path d="M7 8h6M7 11h6M7 14h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Tier 2 · Paper 1</span>
      </button>
      <button class="nav-item" data-view="tier2p3">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v12H4V4Z" stroke="currentColor" stroke-width="1.4"/><path d="M7 8h6M7 11h6M7 14h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Tier 2 · Paper 3</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="ring-mini" id="sidebarRing">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border)" stroke-width="3.4"/>
          <circle id="sidebarRingFill" cx="18" cy="18" r="15.5" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4" transform="rotate(-90 18 18)"/>
        </svg>
      </div>
      <div class="sidebar-foot-text">
        <span class="mono" id="sidebarPct">0%</span>
        <span class="dim">complete</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSubtitle" class="dim">Your study progress at a glance</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M17 17l-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Search topics… (/)" autocomplete="off" />
      </div>
    </header>

    <div id="view" class="view"></div>
  </main>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
